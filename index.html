<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF8A5B" />
  <title>雨锡的默写本</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="title-block">
      <h1>雨锡的默写本</h1>
      <p class="subtitle">二年级语文 · 错词小管家</p>
    </div>
    <div class="header-badge">雨</div>
  </header>

  <nav class="tab-bar" id="tabBar">
    <button class="tab active" data-tab="dash">📊 看板</button>
    <button class="tab" data-tab="practice">✏️ 词语听写</button>
    <button class="tab" data-tab="wrong">❌ 错词本</button>
    <button class="tab" data-tab="bank">📚 词语库</button>
    <button class="tab" data-tab="records">🏆 闯关记录</button>
  </nav>

  <main id="view" class="view"></main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span id="modalTitle"></span>
        <button class="icon-btn" data-act="closemodal" style="background:rgba(255,255,255,.22);color:#fff">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
